<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexos  Bank - Sign In</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Outfit', sans-serif; }
    
    .gradient-bg {
      background: #000000;
    }
    
    .glass-card {
      background: #000000;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .input-field {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }
    
    .input-field:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #ff4d00 0%, #ff4d00 100%);
      transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 77, 0, 0.4);
    }
    
    .btn-primary:active {
      transform: translateY(0);
    }
    
    .floating-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.4;
      animation: float 8s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }
    
    .fade-in {
      animation: fadeIn 0.6s ease-out forwards;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
 </head>
 <body class="h-full">
  
  <div class="gradient-bg h-full w-full overflow-auto relative"><!-- Floating background shapes -->
   <div class="floating-shape w-64 h-64 bg-indigo-500" style="top: 10%; left: -10%; animation-delay: 0s; display: none;"></div>
   <div class="floating-shape w-48 h-48 bg-purple-500" style="bottom: 20%; right: -5%; animation-delay: 2s; display: none;"></div>
   <div class="floating-shape w-32 h-32 bg-blue-500" style="top: 60%; left: 20%; animation-delay: 4s; display: none;"></div>
   <div class="relative z-10 min-h-full flex items-center justify-center p-6">
    <div class="w-full max-w-sm"><!-- Logo/Brand -->
     <div class="text-center mb-8 fade-in" style="animation-delay: 0.1s;">
      <img src="ChatGPT Image Jun 9, 2026, 04_54_32 PM.png" alt="Nexos  Logo" class="w-40 h-40 mx-auto mb-4">
      <h1 id="welcome-title" class="text-2xl font-bold text-white mb-2">Welcome back</h1>
      <p id="subtitle-text" class="text-gray-400 text-sm">Sign in to continue to your account</p>
     </img><!-- Sign In Card -->
     <div class="glass-card rounded-3xl p-8 fade-in" style="animation-delay: 0.2s;">
      <form id="signin-form" class="space-y-5">
       <div><label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email address</label> <input type="email" id="email" name="email" class="input-field w-full px-4 py-3.5 rounded-xl text-white placeholder-gray-500 outline-none" placeholder="Enter your email" required>
       </div>
       <div><label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
        <div class="relative"><input type="password" id="password" name="password" class="input-field w-full px-4 py-3.5 rounded-xl text-white placeholder-gray-500 outline-none pr-12" placeholder="Enter your password" required> <button type="button" id="toggle-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition-colors" aria-label="Toggle password visibility">
          <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg></button>
        </div>
       </div>
       <div class="flex items-center justify-between"><label class="flex items-center cursor-pointer group"> <input type="checkbox" class="sr-only peer" id="remember">
         <div class="w-5 h-5 rounded-md border border-gray-600 peer-checked:bg-indigo-500 peer-checked:border-indigo-500 transition-all flex items-center justify-center">
          <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
          </svg>
         </div><span class="ml-2 text-sm text-gray-400 group-hover:text-gray-300 transition-colors">Remember me</span> </label> <a href="#" class="text-sm text-red-500 hover:text-red-400 transition-colors">Forgot password?</a>
       </div><button type="submit" id="submit-btn" class="btn-primary w-full py-3.5 rounded-xl text-white font-semibold text-base mt-6"> Sign in </button>
      </form><!-- Success Message (hidden by default) -->
      <div id="success-message" class="hidden text-center py-8">
       <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-green-500/20 flex items-center justify-center">
        <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
       </div>
       <h3 class="text-xl font-semibold text-white mb-2">Welcome!</h3>
       <p class="text-gray-400 text-sm">You've successfully signed in.</p>
      </div>
     </div><!-- Sign Up Link -->
     <p class="text-center mt-6 text-gray-400 text-sm fade-in" style="animation-delay: 0.3s;">Don't have an account? <a href="./signup.html" style="color: #ff4d00;" class="hover:text-orange-400 font-medium transition-colors">Sign up</a></p><!-- Demo Notice -->
     <p class="text-center mt-4 text-gray-600 text-xs fade-in" style="animation-delay: 0.4s;"></p>
    </div>
   </div>
  </div>
  <script>
    // Password visibility toggle
    const togglePassword = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      if (type === 'text') {
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
        `;
      } else {
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
        `;
      }
    });

    // Form submission
    const form = document.getElementById('signin-form');
    const successMessage = document.getElementById('success-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      console.log('Attempting login with:', email);
      submitBtn.textContent = 'Signing in...';
      submitBtn.disabled = true;
      
      try {
        console.log('Making fetch request...');
        const response = await fetch('https://backend-xapobank-1.onrender.com/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password }),
        });
        
        console.log('Response status:', response.status);
        const data = await response.json();
        console.log('Response data:', data);
        
        if (data.success && data.token) {
          console.log('Login successful, storing token and redirecting...');
          // Store token in localStorage
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.data));
          
          // Verify storage
          console.log('Token stored:', localStorage.getItem('token') ? 'yes' : 'no');
          
          // Redirect to dashboard
          window.location.href = 'dashboard.html';
        } else {
          console.log('Login failed:', data.message);
          // Show error message
          alert(data.message || 'Login failed. Please check your credentials.');
          submitBtn.textContent = 'Sign in';
          submitBtn.disabled = false;
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('Network error. Please try again later.');
        submitBtn.textContent = 'Sign in';
        submitBtn.disabled = false;
      }
    });

    // Checkbox styling
    const checkbox = document.getElementById('remember');
    const checkboxContainer = checkbox.closest('label').querySelector('div');
    const checkIcon = checkboxContainer.querySelector('svg');

    checkbox.addEventListener('change', () => {
      if (checkbox.checked) {
        checkboxContainer.classList.add('bg-indigo-500', 'border-indigo-500');
        checkIcon.style.opacity = '1';
      } else {
        checkboxContainer.classList.remove('bg-indigo-500', 'border-indigo-500');
        checkIcon.style.opacity = '0';
      }
    });
  </script>
 </body>
</html>
